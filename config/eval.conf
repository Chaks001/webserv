server {
    listen 8080;
    server_name localhost;
    host 127.0.0.1;
    root www;
    index index.html;
    error_page 404 errors/404.html;
    client_max_body_size 1000000;

    location / {
        allow_methods GET POST;
        cgi_pass .py /usr/bin/python3;
    }

    location /redirect {
        allow_methods GET;
        return 301 /;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        root www/uploads;
        upload_store www/uploads;
        autoindex on;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /directory {
        allow_methods GET POST;
        root directory;
        index youpi.bad_extension;
        autoindex on;
    }
}

server {
    listen 8080;
    server_name alt.local;
    host 127.0.0.1;
    root www_alt;
    index index.html;

    location / {
        allow_methods GET;
    }
}

server {
    listen 8081;
    server_name second-port.local;
    host 127.0.0.1;
    root www_alt;
    index index.html;

    location / {
        allow_methods GET;
    }
}
