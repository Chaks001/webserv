server {
    listen 8080;
    server_name localhost;
    root .;

    location / {
        allow_methods GET;
        index index.html;
    }

    location /put_test {
        allow_methods PUT;
        upload_store ./put_test;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /directory {
        allow_methods GET POST;
        root ./directory;
        index youpi.bad_extension;
        cgi_pass .bla ./cgi_tester;
    }
}
